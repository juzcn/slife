name: Publish to PyPI

# slife publishes on its own tag.  credstore / cc-switch / local-embed used to
# live in this repo and publish from here too; they now have their own
# repositories and their own tag rules, so only slife's remain.
#
#   v0.9.6            -> slife      (legacy tag convention, kept for back-compat)
#   slife-v0.9.6      -> slife
#
# The version in pyproject.toml must equal the tag version.

on:
  push:
    tags:
      - 'v*'            # slife (legacy)
      - 'slife-v*'      # slife

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          elif [[ "$TAG" == slife-v* ]]; then
            VERSION="${TAG#slife-v}"
          else
            echo "ERROR: unrecognized tag $TAG"
            exit 1
          fi

          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $TAG != slife version $PKG_VERSION"
            exit 1
          fi
          echo "slife $PKG_VERSION — OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        # twine>=6 is required for trusted publishing (OIDC); <8 keeps the
        # range bounded.  The lower bound is what matters for metadata: twine
        # < 7 rejects Metadata-Version 2.5 ("'2.5' is not a valid metadata
        # version", verified 2026-09), so 6.x in this range only works because
        # pyproject.toml pins hatchling below 1.27 (-> metadata 2.3).
        # Lifting that pin requires raising this floor to >=7 in the same
        # change.  (Not a pkginfo cap — twine >= 6.2 no longer depends on
        # pkginfo.)
        run: pip install 'build' 'twine>=6,<8'

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: twine upload --verbose dist/*
