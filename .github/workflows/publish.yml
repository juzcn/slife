name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versions
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          # Verify slife version
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION != slife version $PKG_VERSION"
            exit 1
          fi
          echo "slife $PKG_VERSION — OK"

          # Verify credstore version
          CRED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('credstore/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$CRED_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION != credstore version $CRED_VERSION"
            exit 1
          fi
          echo "credstore $CRED_VERSION — OK"

          # Verify cc-config version
          CC_VERSION=$(python -c "import tomllib; print(tomllib.load(open('cc-config/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$CC_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION != cc-config version $CC_VERSION"
            exit 1
          fi
          echo "cc-config $CC_VERSION — OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        # twine unpinned (7.x): twine<6 breaks trusted publishing — it falls
        # back to "Enter your API token" (no OIDC in the retry step) and its
        # pkginfo caps Metadata-Version at 2.3, so uploads fail. 7.x handles
        # both.
        run: pip install build twine

      - name: Build slife
        run: python -m build

      - name: Build credstore
        run: cd credstore && python -m build

      - name: Build cc-config
        run: cd cc-config && python -m build

      - name: Publish slife to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: twine upload --verbose dist/*

      - name: Publish credstore to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: twine upload --verbose credstore/dist/*

      - name: Publish cc-config to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: twine upload --verbose cc-config/dist/*
