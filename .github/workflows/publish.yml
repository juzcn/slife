name: Publish to PyPI

# Per-package release: each package in this repo publishes independently
# when its own tag is pushed.
#
#   v0.9.6            -> slife      (legacy tag convention, kept for back-compat)
#   slife-v0.9.6      -> slife
#   credstore-v0.9.6  -> credstore
#   cc-switch-v0.9.6  -> cc-switch
#   mcp-plugin-v0.1.1 -> mcp-plugin
#   local-embed-v0.1.0 -> local-embed
#
# Only the package whose tag prefix matches is built and uploaded.  The
# version in that package's pyproject.toml must equal the tag version.

on:
  push:
    tags:
      - 'v*'            # slife (legacy)
      - 'slife-v*'      # slife
      - 'credstore-v*'
      - 'cc-switch-v*'
      - 'mcp-plugin-v*'
      - 'local-embed-v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve package from tag
        id: resolve
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            PKG="slife"
            VERSION="${TAG#v}"
          elif [[ "$TAG" == slife-v* ]]; then
            PKG="slife"
            VERSION="${TAG#slife-v}"
          elif [[ "$TAG" == credstore-v* ]]; then
            PKG="credstore"
            VERSION="${TAG#credstore-v}"
          elif [[ "$TAG" == cc-switch-v* ]]; then
            PKG="cc-switch"
            VERSION="${TAG#cc-switch-v}"
          elif [[ "$TAG" == mcp-plugin-v* ]]; then
            PKG="mcp-plugin"
            VERSION="${TAG#mcp-plugin-v}"
          elif [[ "$TAG" == local-embed-v* ]]; then
            PKG="local-embed"
            VERSION="${TAG#local-embed-v}"
          else
            echo "ERROR: unrecognized tag $TAG"
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag $TAG -> package $PKG, version $VERSION"

      - name: Verify tag matches package version
        run: |
          PKG="${{ steps.resolve.outputs.pkg }}"
          VERSION="${{ steps.resolve.outputs.version }}"

          # Map package to its pyproject.toml
          case "$PKG" in
            slife)      PYPROJECT="pyproject.toml" ;;
            credstore)  PYPROJECT="credstore/pyproject.toml" ;;
            cc-switch)  PYPROJECT="cc-switch/pyproject.toml" ;;
            mcp-plugin) PYPROJECT="mcp-plugin/pyproject.toml" ;;
            local-embed) PYPROJECT="local-embed/pyproject.toml" ;;
          esac

          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('$PYPROJECT','rb'))['project']['version'])")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $PKG-v$VERSION != $PKG version $PKG_VERSION"
            exit 1
          fi
          echo "$PKG $PKG_VERSION — OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        # twine pinned to 6.x/7.x: trusted publishing (OIDC) needs twine>=6,
        # and its pkginfo handles Metadata-Version 2.4/2.5.  Keep within this
        # range so behavior is deterministic.
        run: pip install 'build' 'twine>=6,<8'

      - name: Build package
        run: |
          PKG="${{ steps.resolve.outputs.pkg }}"
          case "$PKG" in
            slife)     python -m build ;;
            credstore) (cd credstore && python -m build) ;;
            cc-switch) (cd cc-switch && python -m build) ;;
            mcp-plugin) (cd mcp-plugin && python -m build) ;;
            local-embed) (cd local-embed && python -m build) ;;
          esac

      - name: Publish package to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: |
            PKG="${{ steps.resolve.outputs.pkg }}"
            case "$PKG" in
              slife)     twine upload --verbose dist/* ;;
              credstore) twine upload --verbose credstore/dist/* ;;
              cc-switch) twine upload --verbose cc-switch/dist/* ;;
              mcp-plugin) twine upload --verbose mcp-plugin/dist/* ;;
              local-embed) twine upload --verbose local-embed/dist/* ;;
            esac
