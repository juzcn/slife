name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the lock is current
        # credstore / local-embed / cc-switch are ordinary PyPI dependencies
        # now; a stale lock still naming them as workspace editables aborts
        # every `uv run` below.  This fails loudly instead.
        run: uv lock --check

      - name: Build wheel
        run: uv build --out-dir dist

      - name: Install
        run: |
          uv pip install dist/slife-*.whl
          uv pip install pytest pytest-asyncio

      - name: Run tests
        run: uv run pytest -v --tb=short --no-header --maxfail=5

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --frozen ruff check --output-format github

      - name: Ruff format
        run: uv run --frozen ruff format --check

  typecheck:
    name: Type-check
    # Windows, not ubuntu: pyright is pinned to pythonPlatform = "Windows"
    # (see [tool.pyright] in pyproject.toml) because slife reaches
    # ctypes.windll, which does not resolve under Linux stdlib semantics.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --locked

      - name: Pyright
        run: uv run --frozen pyright
