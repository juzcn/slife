name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        run: |
          uv build --out-dir dist
          uv build --out-dir dist --package credstore
          uv build --out-dir dist --package cc-switch
          uv build --out-dir dist --package local-embed

      - name: Install
        run: |
          uv pip install dist/slife-*.whl dist/credstore-*.whl dist/cc_switch-*.whl dist/local_embed-*.whl
          uv pip install pytest pytest-asyncio

      # The one-time tokenizer vocabulary `install.sh` / `install.ps1` fetch at
      # install time.  slife measures context size with tiktoken but never lets
      # it download: the fetch has no timeout (so it can hang rather than fail)
      # and a truncated file would be read as a valid vocabulary and silently
      # mis-count.  It reads the cache dir directly and refuses to start when
      # the file is missing or short — so a runner without it fails the suite
      # rather than skipping.  The filename is the SHA-1 of the blob URL, which
      # is tiktoken's cache key; see README "Tokenizer vocabulary (one-time)".
      - name: Fetch the tokenizer vocabulary
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.cache/tiktoken
          curl -fL --retry 3 --retry-delay 2 \
            -o ~/.cache/tiktoken/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken

      - name: Fetch the tokenizer vocabulary
        if: runner.os == 'Windows'
        run: |
          $dir = Join-Path $env:USERPROFILE ".cache\tiktoken"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken" `
            -OutFile (Join-Path $dir "fb374d419588a4632f3f557e76b4b70aebbca790")

      - name: Run tests
        run: |
          # Each package's own [tool.pytest.ini_options] / testpaths apply
          # when pytest runs from that package's directory.  Use
          # `uv run --directory` (NOT `cd ... &&`), because on the Windows
          # runner PowerShell keeps the working-directory change from `cd`
          # across command separators, breaking the later packages.
          uv run pytest -v --tb=short --no-header --maxfail=5
          uv run --directory credstore pytest -v --tb=short --no-header --maxfail=5
          uv run --directory cc-switch pytest -v --tb=short --no-header --maxfail=5
