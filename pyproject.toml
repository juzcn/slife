[project]
name = "slife"
version = "0.9.6"
description = "Terminal-based AI agent — a function-calling loop with minimum harness"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "json5>=0.15.0",
    "jinja2>=3.1.0",
    "fastmcp>=2.0.0",
    "aiosqlite>=0.22.1",
    "sqlite-vec>=0.1.9",
    "aiohttp>=3.14.1",
    "qrcode>=8.0",
    "Pillow>=11.0",
    "keyring>=25.0.0",
    "keyrings-cryptfile>=1.3.0",
    "paho-mqtt>=2.0.0",
    "requests>=2.31.0",
    "credstore",
    "ngrok",
    "croniter>=6.2.4",
    "tzdata>=2026.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/juzcn/slife"
Repository = "https://github.com/juzcn/slife"

[project.optional-dependencies]
gguf = ["llama-cpp-python"]
transformer = ["sentence-transformers"]
embeddings = ["slife[gguf,transformer]"]

[project.scripts]
slife = "slife:main"
credstore = "credstore.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["slife"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "slife/skills"
"slife.template.json5" = "slife/slife.template.json5"


[tool.hatch.build.targets.sdist]
include = [
    "/slife",
    "/skills",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/pyproject.toml",
    "/slife.template.json5",
]

[build-system]
# Pin below hatchling 1.27: >= 1.27 emits Metadata-Version 2.4/2.5, which
# twine's pkginfo validator still caps at 2.3 (as of 2026-08) — PyPI uploads
# fail with InvalidDistribution "metadata is missing required fields". 1.24-1.26
# emit 2.3, which is always accepted.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
extra-index-url = [
    "https://abetlen.github.io/llama-cpp-python/whl/cpu",
]

[tool.uv.workspace]
members = ["credstore", "cc-switch"]

[tool.uv.sources]
credstore = { workspace = true }
cc-switch = { workspace = true }

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
filterwarnings = [
    # CPython 3.13+: unittest.mock._AsyncMockMixin creates unawaited
    # coroutine wrappers at class-definition time.  GC may collect them
    # during any module import — not just unittest.mock.
    # https://github.com/python/cpython/issues/126242
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
markers = [
    "asyncio: mark a test as an async test (auto-applied by asyncio_mode=strict)",
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]

[tool.coverage.run]
source = ["slife", "credstore", "cc_switch"]
branch = true
omit = ["tests/*", "credstore/tests/*", "cc-switch/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
]
show_missing = true
skip_covered = false

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["slife", "credstore", "cc_switch"]
exclude = ["**/__pycache__/**", "**/.venv/**", ".venv/**", "tests/**", "credstore/tests/**", "cc-switch/tests/**", "**/node_modules", "**/.*"]
extraPaths = ["credstore", "cc-switch"]
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = true
reportInvalidTypeForm = true
reportUnusedImport = "error"     # 抓未用导入(比如 mqtt.py 的 AgentName)
reportUnusedVariable = "error"   # 抓未用变量

