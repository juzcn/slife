[project]
name = "slife"
version = "0.10.0"
description = "Terminal-based AI agent — a function-calling loop with minimum harness"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0.0",
    "rich>=14.2.0",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "httpx2>=2.7.0",
    "ruamel.yaml>=0.19.0",
    "jinja2>=3.1.0",
    "fastmcp>=2.0.0",
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
    "aiosqlite>=0.22.1",
    "sqlite-vec>=0.1.9",
    "aiohttp>=3.14.1",
    "starlette>=0.37.0",
    "qrcode>=8.0",
    "credstore",
    # Out-of-process only — spawned as `python -m local_embed.server`, never imported.
    "local-embed",
    "ngrok",
    "croniter>=6.2.4",
    # Not imported directly; stdlib zoneinfo loads it for IANA zones on Windows.
    "tzdata>=2026.3",
    "filelock>=3.12.0",
    "a2a-over-mqtt>=0.1.0",
    "aiomqtt>=2.5.0",
    "cachetools>=7.1.4",
    "sqlparse>=0.6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/juzcn/slife"
Repository = "https://github.com/juzcn/slife"

[project.optional-dependencies]
gguf = ["llama-cpp-python==0.3.34"]
transformer = ["sentence-transformers"]
embeddings = ["slife[gguf,transformer]"]

[project.scripts]
slife = "slife:main"
# `credstore` is deliberately NOT declared here — the credstore package ships
# that script itself, and slife depends on it, so the command is always present.

[tool.hatch.build.targets.wheel]
packages = ["slife"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "slife/skills"
"slife.yaml" = "slife/slife.yaml"
"local_embed.yaml" = "slife/local_embed.yaml"
"tools.yaml" = "slife/tools.yaml"
"sharefile.yaml" = "slife/sharefile.yaml"


[tool.hatch.build.targets.sdist]
include = [
    "/slife",
    "/skills",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/pyproject.toml",
    "/slife.yaml",
    "/local_embed.yaml",
    "/tools.yaml",
    "/sharefile.yaml",
]

[build-system]
# Pin below hatchling 1.27: >= 1.27 emits Metadata-Version 2.5, which twine
# rejects before 7.0.  Verified 2026-09: hatchling 1.32.3 emits 2.5 for both
# wheel and sdist; `twine check` passes on twine 7.0.0 and fails on twine
# 6.2.0 with InvalidDistribution "'2.5' is not a valid metadata version".
# The cap is twine's own validator, NOT pkginfo — twine >= 6.2 no longer
# depends on pkginfo at all.  1.24-1.26 emit 2.3, which every supported twine
# accepts.  Lift this pin only alongside publish.yml's twine floor, which must
# move to >= 7 in the same change.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cc-switch",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv.workspace]
members = ["credstore", "cc-switch", "local-embed"]

[tool.uv.sources]
credstore = { workspace = true }
local-embed = { workspace = true }
cc-switch = { workspace = true }

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
filterwarnings = [
    # CPython 3.13+: unittest.mock._AsyncMockMixin creates unawaited
    # coroutine wrappers at class-definition time.  GC may collect them
    # during any module import — not just unittest.mock.
    # https://github.com/python/cpython/issues/126242
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]

[tool.coverage.run]
source = ["slife", "credstore", "cc_switch", "local_embed"]
branch = true
omit = ["tests/*", "credstore/tests/*", "cc-switch/tests/*", "local-embed/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
]
show_missing = true
skip_covered = false

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["slife", "credstore", "cc-switch", "local-embed"]
exclude = ["**/__pycache__/**", "**/.venv/**", ".venv/**", "tests/**", "credstore/tests/**", "cc-switch/tests/**", "local-embed/tests/**", "**/node_modules", "**/.*"]
extraPaths = ["credstore", "cc-switch", "local-embed"]
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = true
reportInvalidTypeForm = true
reportUnusedImport = "error"     # 抓未用导入(比如 mqtt.py 的 AgentName)
reportUnusedVariable = "error"   # 抓未用变量

