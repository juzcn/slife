# tools.yaml — every tool the agent can call, by category:
#   builtin    in-process tools shipped with slife (per-tool on/off switch)
#   plugin     built-in plugins' own tools
#   mcp        external MCP servers
#   rest-api   OpenAPI-described external APIs
#   skill      skill entries
#   cli        external command-line tools the agent may run
#   job        job entries (job-coding plugin)
#   tool_load  the loaded-function-tool threshold
#
# A `${VAR}` in an env / auth value resolves through shell env → credstore →
# literal, so API keys belong in the credential store, not here.
#
# The mcp-gateway plugin owns this file; the host reads `builtin` and `cli`
# at startup.  Comments survive a rewrite.

# Per-tool switch.  `enabled: false` keeps the tool out of the registry but
# still gives it a catalog row marked `disabled`, so tool_search can report it
# as switched off rather than as an unknown name.
builtin:
  - name: install_python_package
    enabled: false
# Built-in plugins' own tools.  A plugin decides its own tool set, so
# `enabled: false` here still gets the tool a catalog row marked `disabled`
# (tool_search reports it as switched off, and the model can suggest turning it
# on) — but the tool is not registered, so it cannot be called.
plugin: []
# External MCP servers.  `command` + `args` (+ `env`) launch the server over
# stdio; `url` / `headers` are the remote variants, and `auth` configures an
# OAuth client.
#   enabled: false   stays configured but is not connected
#   autoload: true   every tool this server mirrors starts loaded and is never
#                    evicted; otherwise its tools are on-demand — the model
#                    runs tool_search, then func-tool-load
#   os_paths: true   inject --allow-path for the OS-accessible path set
#   source           provenance recorded by the registry search, not a setting
mcp:
  servers:
    filesystem:
      command: npx
      args:
        - -y
        - '@modelcontextprotocol/server-filesystem'
        - .
      description: Local filesystem operations — read, write, list, and search files within allowed directories.
      enabled: false
    serper:
      command: npx
      args:
        - -y
        - serper-search-scrape-mcp-server
      env:
        SERPER_API_KEY: ${SERPER_API_KEY}
      description: Google web search via Serper — search the web and scrape result pages.
    fetch:
      command: uvx
      args:
        - --with
        - mcp>=1.0,<1.29
        - mcp-server-fetch
      description: Fetch and convert web pages to markdown. Pins mcp<1.29 for McpError compatibility.
    tavily-mcp:
      command: npx
      args:
        - -y
        - tavily-mcp@latest
      env:
        TAVILY_API_KEY: ${TAVILY_API_KEY}
      description: Tavily AI-optimized web search — designed for LLM agents, returns clean structured results.
    duckduckgo-search:
      command: uvx
      autoload: true
      args:
        - --with
        - duckduckgo-mcp-server[browser]
        - duckduckgo-mcp-server
        - --fetch-backend
        - auto
        - --search-backend
        - auto
      description: DuckDuckGo search MCP server — web search and content extraction via DuckDuckGo.
    amap-maps:
      command: npx
      args:
        - -y
        - '@amap/amap-maps-mcp-server'
      description: 高德地图官方 MCP Server，提供地理编码、逆地理编码、IP定位、天气查询、骑行/步行/驾车/公交路径规划、距离测量、关键词/周边/详情POI搜索、专属地图、输入提示、搜索提示、矩形区域交通态势、路径信息、距离测量等多种地图和位置服务。免费，需要申请 Web服务 API Key。
      env:
