[project]
name = "credstore"
version = "0.9.4"
description = "Cross-platform credential storage — OS keyring with AES-encrypted file backup"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.0.0",
    "keyring-wincred>=0.1.0",
    "keyrings-cryptfile>=1.3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.entry-points."keyring.backends"]
wsl = "credstore._wsl_backend:WslBackend"
keyutils = "credstore._keyutils_backend"

[project.urls]
Homepage = "https://github.com/juzcn/slife"
Repository = "https://github.com/juzcn/slife"
Documentation = "https://github.com/juzcn/slife/blob/main/credstore/README.md"

[project.scripts]
credstore = "credstore.__main__:main"

[build-system]
# See root pyproject.toml: pin below hatchling 1.27 so the wheel stays at
# Metadata-Version 2.3 (twine/pkginfo caps there; 2.4/2.5 fail to upload).
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credstore"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --strict-config --no-header --color=yes"
markers = [
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast unit tests with no external I/O dependencies",
    "integration: tests that exercise module interactions (CLI, config loading)",
]
