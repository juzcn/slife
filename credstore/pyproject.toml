[project]
name = "credstore"
version = "0.10.6"
description = "Cross-platform credential storage — OS keyring with AES-encrypted file backup"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.0.0",
    "keyrings-cryptfile>=1.3.0",
    # Imported by name in _wsl_backend / _keyutils_backend.  Also reaches the
    # venv transitively via keyring, but this package imports it directly.
    "jaraco.classes>=3.4.0",
    # Windows Credential Manager enumeration (_enumerate.py).  Guarded there,
    # and also pulled in via keyring, but imported by name on win32.
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.entry-points."keyring.backends"]
wsl = "credstore._wsl_backend:WslBackend"
keyutils = "credstore._keyutils_backend"

[project.urls]
Homepage = "https://github.com/juzcn/slife"
Repository = "https://github.com/juzcn/slife"
Documentation = "https://github.com/juzcn/slife/blob/main/credstore/README.md"

[project.scripts]
credstore = "credstore.__main__:main"

[build-system]
# See root pyproject.toml: pin below hatchling 1.27 so the wheel stays at
# Metadata-Version 2.3 — twine rejects 2.5 before 7.0.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credstore"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]
