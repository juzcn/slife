# ── Media generation (image / video / speech) ───────────────────────────
# Owned by the media plugin.  `defaults` names the model used when a tool call
# does not pick one, as "provider/model".
#
# Each model entry needs a `kind` — the capability:
#   image / video / tts / asr
# `params` are per-kind generation knobs (resolution, ratio, duration) and
# `voice` selects a TTS voice.  `api` on the provider is the wire adapter.
media:
  defaults:
    image: bailian_personal/wan2.7-image
    video: bailian_personal/happyhorse-1.1-t2v
  providers:
    bailian_personal:
      api: dashscope-aigc
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1
      api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
      models:
        - model: wan2.7-image
          kind: image
        - model: wan2.7-image-pro
          kind: image
        - model: qwen-image-3.0-pro
          kind: image
        - model: happyhorse-1.1-t2v
          kind: video
          params:
            resolution: 720P
            ratio: 16:9
            duration: 5
        - model: happyhorse-1.1-i2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: happyhorse-1.1-r2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: qwen-audio-3.0-tts-plus
          kind: tts
          voice: longanhuan_v3.6
        - model: qwen-audio-3.0-asr-flash
          kind: asr

# The model the agent chats with, as a "provider/model" ref.  Switch it at
# runtime from the chat instead of editing this file (model_list →
# model_switch), or with Ctrl+S as an emergency escape if the active model is
# unreachable.
active_model: deepseek/deepseek-flash

# The LLM that deterministic *jobs* call.  Deliberately a different, usually
# smaller/faster model than active_model: a job is a nested one-shot call, and
# a different provider/model keeps it off the agent loop's prompt-cache prefix.
job_coding_model: bailian_personal/qwen3.6-flash

# Plugins that must become ready at startup.  A required plugin that fails
# aborts startup instead of limping on.  Everything not listed here is
# optional — its failure warns and the session continues.
plugins:
  required:
    - memdb
    - memfiles

# A2A agent-to-agent mesh, over MQTT.  `broker` is the MQTT broker to connect
# to; omit the section to stay off the mesh.
a2a:
  broker:
    host: localhost
    port: 1883

# Subagent worker cap — how many spawned subagents may run at once.
subagent:
  max_subagents: 5

# ── Embeddings (semantic memory search) ─────────────────────────────────
# Shared by the memdb and memfiles plugins.  Each provider is ONE
# OpenAI-compatible endpoint: base_url + api_key + the single model id sent on
# /v1/embeddings.  The vector dimension is never configured — it is detected
# from the endpoint at runtime.
embeddings:
  providers:
    local_embed:
      base_url: http://127.0.0.1:17347/v1
      model: bge-m3
      api_key: local
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
      api_key: ${SILICONFLOW_API_KEY}
  # A provider ID only — no "provider/model" ref.  A missing or stale value
  # falls back to the first provider.
  active_model: siliconflow
  # false disables semantic search; keyword (FTS5) search keeps working.
  enabled: true
