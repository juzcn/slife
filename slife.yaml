# slife.yaml — the agent's own config: which models to talk to, how the loop
# behaves, and which plugins are required.
#
# Every ${VAR} / ${VAR:-default} reference resolves at runtime through
# shell env → credstore → literal default, so secrets belong in the credential
# store (`credstore set KEY`), not in this file.
#
# Comments survive slife rewriting the file — a write edits this document
# rather than re-serialising it.

# Environment variables injected into the process at startup.  The key IS the
# credential-store key, so `credstore set BAIDU_API_KEY` satisfies this line
# without editing the file.
env:
  BAIDU_API_KEY: ${BAIDU_API_KEY}

# ── The agent loop ──────────────────────────────────────────────────────
agent:
  # Model calls allowed in a single turn before it is cut off.
  max_iterations: 30
  # Context trimming, as a fraction of the active model's context_window.
  # Trimming fires once a turn's usage reaches context_ceiling and compresses
  # back down to context_floor by dropping the oldest *complete* turns — the
  # turn just finished is never dropped.  0.8 / 0.2 = trim at 80%, to 20%.
  context_floor: 0.2
  context_ceiling: 0.8
  # Rebuild the context from a recall selection before every turn.
  # true  — recall selects the context before every turn.
  # false — the context grows append-only.
  # Either way the internal trim bounds the window at context_ceiling /
  # context_floor.  The two modes are compatible — both maintain the same
  # persisted live-context list and the same save path, so this can be
  # flipped freely.
  rebuild_message: true
  # Recall caps (rebuild mode only).
  # Cosine similarity a semantic hit must reach to enter the context; the
  # budget is context_floor (the same knob the trim compacts to), so flipping
  # rebuild_message changes how the context is chosen, never how big it is.
  recall_min_similarity: 0.35
  # Maximum turns in a recall selection.
  recall_limit: 40
  # Idle heartbeat period in SECONDS (1800 = 30 min): how often an otherwise
  # idle agent may wake itself for a scheduled turn.
  heartbeat_interval: 1800
  # Mid-turn input preemption.  true — a message arriving while a turn runs
  # cuts in at the next safe iteration boundary.  false — it waits in the
  # queue until the turn ends.
  cutin_enabled: true

# ── Models ──────────────────────────────────────────────────────────────
# One entry per provider; base_url / api_key / api are shared by every model
# listed under it.  `api` selects the wire backend:
#   openai-completions   OpenAI / DeepSeek / Ollama / MiniMax
#   anthropic-messages   Claude / Bailian (Qwen)
#   openai-responses     OpenAI Responses
#
# Each model entry:
#   model                 API model name; doubles as the local id, referenced
#                         elsewhere as "provider/model"
#   name                  display label for the picker and logs
#   reasoning             the model thinks natively
#   input                 modalities accepted — list image only for vision
#                         models (attach_image refuses without it)
#   context_window        token budget driving the trim above
#   max_tokens            output cap
#   temperature / top_p   sampling; omitted means the gateway's default
#   compat.thinking       omit — send no thinking field (for gateways that
#                         reject the standard shape yet reason natively);
#                         disabled / enabled are also accepted
#   compat.thinkingFormat openai — on an anthropic backend: the model always
#                         thinks, so no thinking parameter is sent
models:
  # Not read by the current code — providers are always merged into the model
  # registry.  Retained for forward compatibility.
  mode: merge
  providers:
    deepseek:
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      api: openai-completions
      models:
        - model: deepseek-flash
          name: DeepSeek V4.1 Flash
          reasoning: true
          input:
            - text
            - image
          context_window: 1000000
          max_tokens: 384000
          temperature: 0.7
          top_p: 1.0
    qianfan:
      base_url: https://qianfan.baidubce.com/v2/tokenplan/personal
      api_key: ${QIANFAN_API_KEY}
